name: Daily Reliability Rebuild

on:
  schedule:
    - cron: '14 0 * * *'
  workflow_dispatch:

jobs:
  trigger-reliability-rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reliability rebuild
        env:
          BACKEND_URL: https://point-meteo.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN secret is missing"
            exit 1
          fi

          curl -fsS -X POST "$BACKEND_URL/admin/reliability/rebuild" \
            -H "x-admin-token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json"